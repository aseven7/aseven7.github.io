<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pages — aseven7</title>
  <meta name="description" content="A curated collection of static pages by aseven7.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <!-- Ambient background blobs -->
  <div class="bg-blob bg-blob--1" aria-hidden="true"></div>
  <div class="bg-blob bg-blob--2" aria-hidden="true"></div>

  <header class="header">
    <div class="header__logo">
      <span class="header__logo-icon">◈</span>
      <span class="header__logo-text">aseven7</span>
    </div>
    <p class="header__tagline">The Single App Projects.</p>
  </header>

  <main class="main">
    <!-- Search / Filter -->
    <div class="search-bar">
      <svg class="search-bar__icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" id="searchInput" class="search-bar__input" placeholder="Search pages…" autocomplete="off">
    </div>

    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Page cards grid -->
    <section class="grid" id="grid">
      <!-- Cards injected by JS -->
    </section>

    <!-- Empty state -->
    <div class="empty" id="empty" hidden>
      <p class="empty__icon">📭</p>
      <p class="empty__text">No pages found.</p>
      <p class="empty__hint">Drop an <code>.html</code> file into the <code>pages/</code> folder, push to GitHub, and it
        will appear here automatically.</p>
    </div>

    <!-- Loading state -->
    <div class="loading" id="loading">
      <div class="loading__spinner"></div>
      <p>Loading pages…</p>
    </div>
  </main>

  <footer class="footer">
    <p>Powered by GitHub Pages · Auto-indexed by <a href="https://github.com/aseven7/aseven7.github.io" target="_blank"
        rel="noopener">aseven7</a></p>
  </footer>

  <script src="index.js"></script>
</body>

</html>
